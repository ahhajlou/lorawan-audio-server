[project]
name = "lorawan-audio-server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cffi>=2.1.0",
    "loguru>=0.7.3",
    "paho-mqtt>=2.1.0",
    "pydantic~=2.13.4",
    "python-dotenv>=1.2.2",
    "sqlalchemy~=2.0.51",
    "tenacity>=9.1.4",
]

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = [".venv", "__pycache__"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.6.9",
]
